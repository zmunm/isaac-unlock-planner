<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isaac Unlock Planner</title>
    <meta name="description" content="Reads your Steam achievements for The Binding of Isaac: Repentance+ and tells you which run to play next, and what it unlocks." />
    <meta property="og:title" content="Isaac Unlock Planner" />
    <meta property="og:description" content="Which character, which route, what it unlocks — planned from your Steam achievements." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://isaac-unlock-planner.zmunm.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- Filter that wobbles the paper edge like bleeding ink — used by .paper::before in style.css -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="ink">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" />
        <feDisplacementMap in="SourceGraphic" scale="5" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
